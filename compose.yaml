services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先复制 .env.example 为 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-equipment_booking}
      MYSQL_USER: ${MYSQL_USER:-equipment}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先配置 .env}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
  backend:
    image: maven:3.9.11-eclipse-temurin-25
    profiles: ["app"]
    working_dir: /workspace/backend
    command: ["mvn", "spring-boot:run"]
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-equipment_booking}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${MYSQL_USER:-equipment}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
    volumes:
      - ./backend:/workspace/backend
      - maven_cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
  mysql-test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: test-root-only
      MYSQL_DATABASE: equipment_booking_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test-only
      TZ: Asia/Shanghai
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=test-only mysql -h 127.0.0.1 -utest equipment_booking_test -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 40
  test-runner:
    image: maven:3.9.11-eclipse-temurin-25
    profiles: ["test"]
    working_dir: /workspace/backend
    command: ["mvn", "verify"]
    environment:
      IT_DB_URL: jdbc:mysql://mysql-test:3306/equipment_booking_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      IT_DB_USERNAME: test
      IT_DB_PASSWORD: test-only
    volumes:
      - ./backend:/workspace/backend
      - maven_cache:/root/.m2
    depends_on:
      mysql-test:
        condition: service_healthy
volumes:
  mysql_data:
  maven_cache:

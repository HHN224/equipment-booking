server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/equipment_booking?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:equipment}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 16
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
  mvc:
    log-resolved-exception: false
app:
  demo-data-enabled: ${DEMO_DATA_ENABLED:true}
